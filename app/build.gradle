plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'app.narabuspulse'
    compileSdk 37

    defaultConfig {
        applicationId 'app.narabuspulse'
        minSdk 26
        targetSdk 37
        versionCode 11
        versionName '3.1.0'
        buildConfigField 'String', 'BASE_URL', '"https://nara-bus-pulse.base44.app"'
    }

    // 署名鍵は環境変数で渡す（README 参照）。未設定ならデバッグ鍵。
    def ks = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // 開発用：DEV_BASE_URL で接続先を公開前のプレビューに切り替えられる（リリース版は常に本番）
            def devBase = System.getenv('DEV_BASE_URL')
            if (devBase) buildConfigField 'String', 'BASE_URL', "\"${devBase}\""
            // 開発用：DEV_MINIFY=1 でリリース版と同じコード縮小（R8）をかけて動作確認できる
            if (System.getenv('DEV_MINIFY')) {
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }
        release {
            // 使っていないコード・リソースを取り除く（アイコン集などが大きいため、APK が大幅に小さくなる）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.navigation:navigation-compose:2.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.browser:browser:1.9.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.2'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.2'
    implementation 'io.github.dokar3:quickjs-kt-android:1.0.17'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}

// 開発用：環境変数 DEV_PROXY_CA に証明書ファイルがあれば、デバッグ版にだけ組み込む（リポジトリには含めない）。
// 無ければ空のファイルになり、何も追加で信頼しない。
def devProxyRes = layout.buildDirectory.dir('generated/devProxyRes').get().asFile
def devProxyCa = System.getenv('DEV_PROXY_CA')
new File(devProxyRes, 'raw').mkdirs()
new File(devProxyRes, 'raw/dev_proxy_ca.pem').bytes = (devProxyCa && file(devProxyCa).exists()) ? file(devProxyCa).bytes : new byte[0]
android.sourceSets.debug.res.srcDirs += devProxyRes
