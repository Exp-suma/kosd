plugins {
    id 'com.android.application'
}

android {
    namespace 'app.narabuspulse'
    compileSdk 36

    defaultConfig {
        applicationId 'app.narabuspulse'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '2.0.1'
    }

    // 署名鍵は環境変数で渡す（README 参照）。
    // TWA を全画面表示にするには、この鍵の SHA-256 をサイトの assetlinks.json に登録する必要がある。
    def ks = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
