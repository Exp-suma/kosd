plugins {
    id 'com.android.application'
}

android {
    namespace 'app.narabuspulse'
    compileSdk 34

    defaultConfig {
        applicationId 'app.narabuspulse'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // GitHub Actions などで環境変数から署名鍵を渡す（未設定ならデバッグ鍵で署名）
    def ks = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
